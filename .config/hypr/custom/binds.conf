# https://wiki.hyprland.org/Configuring/Binds

$hypr   = ~/.config/hypr/scripts
$rofi   = ~/.config/rofi/scripts
$waybar = ~/.config/waybar/scripts

$mod       = Super
$mod_alt   = $mod Alt
$mod_ctrl  = $mod Ctrl
$mod_shift = $mod Shift

$terminal = kitty
$ide      = code
$explorer = nautilus
$browser  = zen-browser
$bar      = waybar
$lock     = hyprlock

#----------#
#   Rofi   #
#----------#

bind = $mod, A, exec, $rofi/rofi.sh a # app launcher
bind = $mod, V, exec, $rofi/rofi.sh v # clipboard
bind = $mod, X, exec, $rofi/rofi.sh x # calculator
bind = $mod, M, exec, $rofi/rofi.sh m # emoji picker
bind = $mod, W, exec, $rofi/rofi.sh w # window switcher

#----------#
#   Apps   #
#----------#

bind = $mod, T,       exec, $terminal
bind = $mod, C,       exec, $ide
bind = $mod, E,       exec, $explorer
bind = $mod, F,       exec, $browser
bind = $mod_shift, F, exec, $browser --private-window

#---------#
#   CLI   #
#---------#

bind = $mod, B, exec, $terminal -e $waybar/bluetooth
bind = $mod, N, exec, $terminal -e $waybar/network
bind = $mod, O, exec, $terminal -e $waybar/power
bind = $mod, U, exec, $terminal -e $waybar/update

#------------#
#   System   #
#------------#

# Screen lock
bind = $mod_shift, Backspace, exec, $lock

# Status bar
bind = $mod_ctrl, W, exec, pkill $bar || $bar

# Toggle off
bind = $mod, B, exec, $terminal -e $waybar/bluetooth off
bind = $mod, N, exec, $terminal -e $waybar/network off

# Audio
bindl  = , XF86AudioMicMute,     exec, $waybar/volume input  mute
bindl  = , XF86AudioMute,        exec, $waybar/volume output mute
bindel = , XF86AudioLowerVolume, exec, $waybar/volume output lower
bindel = , XF86AudioRaiseVolume, exec, $waybar/volume output raise
bindl  = $mod_alt, M, exec, $waybar/volume output mute
bindel = $mod_alt, L, exec, $waybar/volume output lower
bindel = $mod_alt, R, exec, $waybar/volume output raise

# Media
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous
bindl = , XF86AudioNext,  exec, playerctl next

# Brightness
bindel = , XF86MonBrightnessDown, exec, $waybar/backlight down
bindel = , XF86MonBrightnessUp,   exec, $waybar/backlight up
bindel = $mod_alt, D, exec, $waybar/backlight down
bindel = $mod_alt, U, exec, $waybar/backlight up

# Screenshot
bindl =     , Print,  exec, $hypr/screenshot area
bindl = $mod, P,      exec, $hypr/screenshot area
bindl = $mod, Print,  exec, $hypr/screenshot screen
bindl = $mod_ctrl, P, exec, $hypr/screenshot screen
bindl = $mod_alt, P,  exec, $hypr/screenshot active

# Zoom
binde = $mod_shift, mouse:272, exec, $hypr/zoom 0.5
bind  = $mod_shift, mouse:273, exec, $hypr/zoom

#-------------#
#   Windows   #
#-------------#

bind = $mod, Return, fullscreen
bind = $mod_shift, W, togglefloating

# Change focus
binde = $mod, Backslash, cyclenext,
binde = $mod, Backslash, bringactivetotop,

bind = $mod, Left,  movefocus, l
bind = $mod, Down,  movefocus, d
bind = $mod, Up,    movefocus, u
bind = $mod, Right, movefocus, r
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Resize
bindm = $mod, mouse:273, resizewindow
binde = $mod_shift, Left,  resizeactive, -10   0
binde = $mod_shift, Down,  resizeactive,   0  10
binde = $mod_shift, Up,    resizeactive,   0 -10
binde = $mod_shift, Right, resizeactive,  10   0
binde = $mod_shift, H, resizeactive, -10   0
binde = $mod_shift, J, resizeactive,   0  10
binde = $mod_shift, K, resizeactive,   0 -10
binde = $mod_shift, L, resizeactive,  10   0

# Minimize
bind = $mod, S, togglespecialworkspace, magic
bind = $mod, S, movetoworkspace, +0
bind = $mod, S, togglespecialworkspace, magic
bind = $mod, S, movetoworkspace, special:magic
bind = $mod, S, togglespecialworkspace, magic

# Close
bind = $mod, Q, exec, hyprctl dispatch killactive ""

# Move
bindm = $mod, mouse:272, movewindow
bind = $mod_shift Ctrl, Left,  movewindow, l
bind = $mod_shift Ctrl, Down,  movewindow, d
bind = $mod_shift Ctrl, Up,    movewindow, u
bind = $mod_shift Ctrl, Right, movewindow, r
bind = $mod_shift Ctrl, H, movewindow, l
bind = $mod_shift Ctrl, J, movewindow, d
bind = $mod_shift Ctrl, K, movewindow, u
bind = $mod_shift Ctrl, L, movewindow, r

# Move to a workspace
bind = $mod_shift, 1, movetoworkspace,  1
bind = $mod_shift, 2, movetoworkspace,  2
bind = $mod_shift, 3, movetoworkspace,  3
bind = $mod_shift, 4, movetoworkspace,  4
bind = $mod_shift, 5, movetoworkspace,  5
bind = $mod_shift, 6, movetoworkspace,  6
bind = $mod_shift, 7, movetoworkspace,  7
bind = $mod_shift, 8, movetoworkspace,  8
bind = $mod_shift, 9, movetoworkspace,  9
bind = $mod_shift, 0, movetoworkspace, 10

# Move to a relative workspace
bind = $mod_ctrl Alt, Left,  movetoworkspace, r-1
bind = $mod_ctrl Alt, Right, movetoworkspace, r+1
bind = $mod_ctrl Alt, H, movetoworkspace, r-1
bind = $mod_ctrl Alt, L, movetoworkspace, r+1

# Move to a workspace silently
bind = $mod_alt, 1, movetoworkspacesilent,  1
bind = $mod_alt, 2, movetoworkspacesilent,  2
bind = $mod_alt, 3, movetoworkspacesilent,  3
bind = $mod_alt, 4, movetoworkspacesilent,  4
bind = $mod_alt, 5, movetoworkspacesilent,  5
bind = $mod_alt, 6, movetoworkspacesilent,  6
bind = $mod_alt, 7, movetoworkspacesilent,  7
bind = $mod_alt, 8, movetoworkspacesilent,  8
bind = $mod_alt, 9, movetoworkspacesilent,  9
bind = $mod_alt, 0, movetoworkspacesilent, 10

#----------------#
#   Workspaces   #
#----------------#

# Switch
bind = $mod, 1, workspace,  1
bind = $mod, 2, workspace,  2
bind = $mod, 3, workspace,  3
bind = $mod, 4, workspace,  4
bind = $mod, 5, workspace,  5
bind = $mod, 6, workspace,  6
bind = $mod, 7, workspace,  7
bind = $mod, 8, workspace,  8
bind = $mod, 9, workspace,  9
bind = $mod, 0, workspace, 10

# Switch to relative
bind = $mod_ctrl, Left,  workspace, r-1
bind = $mod_ctrl, Right, workspace, r+1
bind = $mod_ctrl, H, workspace, r-1
bind = $mod_ctrl, L, workspace, r+1

# Move to first empty
bind = $mod_ctrl, Down, workspace, empty
bind = $mod_ctrl, J,    workspace, empty

# Scroll through existing
bind = $mod, mouse_up,   workspace, e-1
bind = $mod, mouse_down, workspace, e+1
