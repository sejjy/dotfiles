# https://wiki.hyprland.org/Configuring/Binds

$bin = ~/.local/bin
$term = kitty

# Rofi
bind = Super, A, exec, $bin/launch app
bind = Super, V, exec, $bin/launch clip
bind = Super, X, exec, $bin/launch calc
bind = Super, M, exec, $bin/launch emoji
bind = Super, W, exec, $bin/launch win

# Quick launch
bind = Super, T, exec, $term
bind = Super, C, exec, code
bind = Super, E, exec, nautilus
bind = Super, F, exec, zen-browser
bind = Super Shift, F, exec, zen-browser --private-window
bind = Super Shift, Backspace, exec, hyprlock
bind = Super Ctrl, W, exec, pkill waybar || waybar

# CLI
bind = Super, B, exec, $term -e $bin/bluetooth
bind = Super, N, exec, $term -e $bin/network
bind = Super, O, exec, $term -e $bin/power
bind = Super, U, exec, $term -e $bin/update

# Toggle off
bind = Super Alt, B, exec, $bin/bluetooth off
bind = Super Alt, N, exec, $bin/network off

# Audio
bindl  = , XF86AudioMicMute,     exec, $bin/volume input  mute
bindl  = , XF86AudioMute,        exec, $bin/volume output mute
bindel = , XF86AudioLowerVolume, exec, $bin/volume output lower
bindel = , XF86AudioRaiseVolume, exec, $bin/volume output raise
bindl  = Super Alt, M, exec, $bin/volume output mute
bindel = Super Alt, L, exec, $bin/volume output lower
bindel = Super Alt, R, exec, $bin/volume output raise

# Media
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous
bindl = , XF86AudioNext,  exec, playerctl next

# Brightness
bindel = , XF86MonBrightnessDown, exec, $bin/backlight down
bindel = , XF86MonBrightnessUp,   exec, $bin/backlight up
bindel = Super Alt, D, exec, $bin/backlight down
bindel = Super Alt, U, exec, $bin/backlight up

# Screenshot
bindl =      , Print,  exec, $bin/screenshot area
bindl = Super, P,      exec, $bin/screenshot area
bindl = Super, Print,  exec, $bin/screenshot screen
bindl = Super Ctrl, P, exec, $bin/screenshot screen
bindl = Super Alt, P,  exec, $bin/screenshot active

# Zoom
binde = Super Shift, mouse:272, exec, $bin/zoom 0.5
bind  = Super Shift, mouse:273, exec, $bin/zoom reset

#-------------#
#   Windows   #
#-------------#

# Change mode
bind = Super, Return, fullscreen
bind = Super Shift, W, togglefloating

# Change focus
binde = Super, Backslash, cyclenext,
binde = Super, Backslash, bringactivetotop,

bind = Super, Left,  movefocus, l
bind = Super, Down,  movefocus, d
bind = Super, Up,    movefocus, u
bind = Super, Right, movefocus, r
bind = Super, H, movefocus, l
bind = Super, J, movefocus, d
bind = Super, K, movefocus, u
bind = Super, L, movefocus, r

# Resize
bindm = Super, mouse:273, resizewindow
binde = Super Shift, Left,  resizeactive, -10   0
binde = Super Shift, Down,  resizeactive,   0  10
binde = Super Shift, Up,    resizeactive,   0 -10
binde = Super Shift, Right, resizeactive,  10   0
binde = Super Shift, H, resizeactive, -10   0
binde = Super Shift, J, resizeactive,   0  10
binde = Super Shift, K, resizeactive,   0 -10
binde = Super Shift, L, resizeactive,  10   0

# Minimize
bind = Super, S, togglespecialworkspace, magic
bind = Super, S, movetoworkspace, +0
bind = Super, S, togglespecialworkspace, magic
bind = Super, S, movetoworkspace, special:magic
bind = Super, S, togglespecialworkspace, magic

# Close
bind = Super, Q, exec, hyprctl dispatch killactive ""

# Move
bindm = Super, mouse:272, movewindow
bind = Super Shift Ctrl, Left,  movewindow, l
bind = Super Shift Ctrl, Down,  movewindow, d
bind = Super Shift Ctrl, Up,    movewindow, u
bind = Super Shift Ctrl, Right, movewindow, r
bind = Super Shift Ctrl, H, movewindow, l
bind = Super Shift Ctrl, J, movewindow, d
bind = Super Shift Ctrl, K, movewindow, u
bind = Super Shift Ctrl, L, movewindow, r

# Move to a workspace
bind = Super Shift, 1, movetoworkspace,  1
bind = Super Shift, 2, movetoworkspace,  2
bind = Super Shift, 3, movetoworkspace,  3
bind = Super Shift, 4, movetoworkspace,  4
bind = Super Shift, 5, movetoworkspace,  5
bind = Super Shift, 6, movetoworkspace,  6
bind = Super Shift, 7, movetoworkspace,  7
bind = Super Shift, 8, movetoworkspace,  8
bind = Super Shift, 9, movetoworkspace,  9
bind = Super Shift, 0, movetoworkspace, 10

# Move to a relative workspace
bind = Super Ctrl Alt, Left,  movetoworkspace, r-1
bind = Super Ctrl Alt, Right, movetoworkspace, r+1
bind = Super Ctrl Alt, H, movetoworkspace, r-1
bind = Super Ctrl Alt, L, movetoworkspace, r+1

# Move to a workspace silently
bind = Super Alt, 1, movetoworkspacesilent,  1
bind = Super Alt, 2, movetoworkspacesilent,  2
bind = Super Alt, 3, movetoworkspacesilent,  3
bind = Super Alt, 4, movetoworkspacesilent,  4
bind = Super Alt, 5, movetoworkspacesilent,  5
bind = Super Alt, 6, movetoworkspacesilent,  6
bind = Super Alt, 7, movetoworkspacesilent,  7
bind = Super Alt, 8, movetoworkspacesilent,  8
bind = Super Alt, 9, movetoworkspacesilent,  9
bind = Super Alt, 0, movetoworkspacesilent, 10

#----------------#
#   Workspaces   #
#----------------#

# Switch
bind = Super, 1, workspace,  1
bind = Super, 2, workspace,  2
bind = Super, 3, workspace,  3
bind = Super, 4, workspace,  4
bind = Super, 5, workspace,  5
bind = Super, 6, workspace,  6
bind = Super, 7, workspace,  7
bind = Super, 8, workspace,  8
bind = Super, 9, workspace,  9
bind = Super, 0, workspace, 10

# Switch to relative
bind = Super Ctrl, Left,  workspace, r-1
bind = Super Ctrl, Right, workspace, r+1
bind = Super Ctrl, H, workspace, r-1
bind = Super Ctrl, L, workspace, r+1

# Move to first empty
bind = Super Ctrl, Down, workspace, empty
bind = Super Ctrl, J, workspace, empty

# Scroll through existing
bind = Super, mouse_up,   workspace, e-1
bind = Super, mouse_down, workspace, e+1
