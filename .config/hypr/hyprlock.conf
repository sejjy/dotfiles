# https://wiki.hypr.land/0.54.0/Hypr-Ecosystem/hyprlock/

animations {
	animation = fade, 0
}

general {
	hide_cursor        = true
	ignore_empty_input = true
	fractional_scaling = 1
}

background {
	path        = ~/Pictures/wallpapers/wallpaper.jpg
	blur_passes = 2
	blur_size   = 6
	brightness  = 0.65
}

image {
	path         = ~/Pictures/personal/user.jpg
	size         = 225
	border_size  = 4
	border_color = rgba(b4befeff)
	position     = 0, 145
}

label {
	text        = $USER
	color       = rgba(b4befeff)
	font_size   = 24
	font_family = CommitMono Nerd Font Bold
	position    = 0, -15
	halign      = center
	valign      = center
}

input-field {
	size              = 300, 40
	outline_thickness = 3
	dots_size         = 0.2
	dots_spacing      = 0.40
	outer_color       = rgba(b4befeff)
	inner_color       = rgba(11111bff)
	font_color        = rgba(b4befeff)
	font_family       = CommitMono Nerd Font
	fade_on_empty     = false
	placeholder_text  = <span foreground="##9399b2">Password</span>
	rounding          = 0
	check_color       = rgba(b4befeff)
	fail_color        = rgba(f38ba8ff)
	fail_text         = <span foreground="##9399b2">Password</span>
	position          = 0, -100
}

# Last auth fail reason
label {
	text        = $FAIL
	color       = rgba(f38ba8ff)
	font_size   = 11
	font_family = CommitMono Nerd Font
	position    = 0, -150
	halign      = center
	valign      = center
}

label {
	text        = cmd[update:1000] ~/.local/bin/track truncate
	color       = rgba(cdd6f4ff)
	font_size   = 12
	font_family = CommitMono Nerd Font
	position    = 0, -500
	halign      = center
	valign      = center
}
