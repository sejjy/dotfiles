include themes/github-dark.conf

font_family                family="GoogleSansCode Nerd Font" style=Light
bold_font                  family="GoogleSansCode Nerd Font" style=Regular
italic_font                family="GoogleSansCode Nerd Font" style="Light Italic"
bold_italic_font           family="GoogleSansCode Nerd Font" style=Italic
font_size                  14.0
disable_ligatures          always

map ctrl+shift+h           no_op
map ctrl+shift+l           no_op

cursor_shape               block
shell_integration          no-cursor
cursor_trail               0

hide_window_decorations    true
window_margin_width        16 24
confirm_os_window_close    0
enable_audio_bell          no
